
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dashit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dashit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashit -d dashit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://dashit:password@db/dashit_db
      - JWT_SECRET_KEY=supersecretkey-dev-only-change-in-prod
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - CLOUDINARY_URL=cloudinary://test
      - SMTP_HOST=smtp.test
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8000
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
