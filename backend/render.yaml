services:
  - type: web
    name: dash-it-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && gunicorn -c gunicorn.conf.py app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dash-it-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: "/api/health"

  - type: psql
    name: dash-it-db
    databaseName: dashit_db
    user: dashit
    plan: free
