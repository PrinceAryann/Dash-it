services:
  - type: web
    name: dash-it-api
    runtime: python
    plan: free
    region: singapore

    rootDir: backend

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    preDeployCommand: |
      alembic upgrade head
      python scripts/seed_admin.py

    startCommand: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -c gunicorn.conf.py

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: APP_NAME
        value: Dash-it API

      # Add the remaining variables manually in Render Dashboard.
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: MAIL_SERVER
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_STARTTLS
        value: "true"

      - key: MAIL_SSL_TLS
        value: "false"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
